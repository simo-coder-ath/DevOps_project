<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestion d'utilisateurs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Gestion d'utilisateurs</h1>

    <div id="message" class="message" hidden></div>

    <form id="user-form">
      <input type="hidden" id="user-id">
      <label>Nom
        <input type="text" id="nom" required>
      </label>
      <label>Email
        <input type="email" id="email" required>
      </label>
      <label>Rôle
        <select id="role">
          <option value="USER">USER</option>
          <option value="ADMIN">ADMIN</option>
        </select>
      </label>
      <div class="actions">
        <button type="submit" id="save-btn">Enregistrer</button>
        <button type="button" id="cancel-btn" hidden>Annuler</button>
      </div>
    </form>

    <table>
      <thead>
        <tr>
          <th>ID</th><th>Nom</th><th>Email</th><th>Rôle</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="users-body"></tbody>
    </table>
  </main>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
